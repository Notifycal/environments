name: Destroy environment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Name of the environment to destroy.'
        required: false
        type: string
  schedule:
    - cron: '0 4 * * *' # Every day at 4:00 UTC

env:
  AWS_REGION: eu-west-1

jobs:
  filter-envs:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set-matrix.outputs.envs }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
            
      - name: Detect/verify environments to destroy (dev*)
        id: set-matrix
        run: .github/scripts/detect-dev-envs-to-destroy.sh
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          FILTERS_FILE: .github/filters.yaml
          KEEP_ENVS_DIR: .keep-envs
      
  destroy:
    needs: filter-envs
    if: ${{ needs.filter-envs.outputs.envs != '[]' }}
    strategy:
      matrix:
        env: ${{ fromJson(needs.filter-envs.outputs.envs) }}
    continue-on-error: true   # this will ensure the workflow continues even if one of the destroy jobs fails
    runs-on: ubuntu-latest
    name: 'Destroy: ${{ matrix.env }}'
    permissions:
      contents: read
      id-token: write

    concurrency:
      # github.head_ref is only set when the workflow was triggered by a pull_request and it
      # contains the value of the source branch of the PR.
      group: ${{ github.workflow }}-${{ matrix.env }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - run: echo "Destroying ${{ matrix.env }} environment"
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Get GH token from Github App
        id: gh-app-auth
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.NOTIFYCAL_CICD_APP_ID }}
          private_key: ${{ secrets.NOTIFYCAL_CICD_APP_SECRET }}

      - name: Hack for github internal repo access :(
        id: gh_internal_repo_access
        run: git config --global url."https://foo:${{ steps.gh-app-auth.outputs.token }}@github.com".insteadOf ssh://git@github.com

      - name: Configure AWS Credentials
        id: config_aws_credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_CI }}
          role-session-name: run-${{ github.run_id }}
      - run: aws sts get-caller-identity
        id: aws_sts_get_caller_identity

      - name: Get TF/TG version from version files
        id: get_tf_tg_version
        run: |
          echo "tofu_version=$(cat .opentofu-version)" >> "${GITHUB_OUTPUT}"
          echo "terragrunt_version=$(cat .terragrunt-version)" >> "${GITHUB_OUTPUT}"
      
      - name: Cached tofu and terragrunt binaries?
        id: tbinaries-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/tofu
            /usr/local/bin/terragrunt
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}-tg-${{ env.TG_VERSION }}
        env:
          TOFU_VERSION: ${{ steps.get_tf_tg_version.outputs.tofu_version }}
          TG_VERSION: ${{ steps.get_tf_tg_version.outputs.terragrunt_version }}

      - name: Install OpenTofu and Terragrunt
        id: tf_tg_install
        # Only if there is no cache
        if: steps.tbinaries-cache.outputs.cache-hit != 'true'
        run: |
          TEMP_DIR=$(mktemp -d)
          TOFU_DOWNLOAD_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          TG_DOWNLOAD_URL="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"

          curl -sL "${TOFU_DOWNLOAD_URL}" -o "${TEMP_DIR}/tofu.tar.gz"
          curl -sL "${TG_DOWNLOAD_URL}" -o "${TEMP_DIR}/terragrunt" 
          
          tar -zxf "${TEMP_DIR}/tofu.tar.gz" -C "${TEMP_DIR}"

          chmod +x "${TEMP_DIR}/tofu" "${TEMP_DIR}/terragrunt"
          sudo mv "${TEMP_DIR}/tofu" "${TEMP_DIR}/terragrunt" /usr/local/bin

          rm -rf "${TEMP_DIR}"

          terragrunt --version
          tofu --version
        env:
          TOFU_VERSION: ${{ steps.get_tf_tg_version.outputs.tofu_version }}
          TG_VERSION: ${{ steps.get_tf_tg_version.outputs.terragrunt_version }}

      - name: Terragrunt init
        id: tg_init
        run: |
          cd envs/${{ matrix.env }}
          terragrunt run-all init
        env:
          GH_TOKEN: ${{ steps.gh-app-auth.outputs.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terragrunt destroy
        id: tg_destroy
        run: |
          cd envs/${{ matrix.env }}
          terragrunt run-all destroy
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          GH_TOKEN: ${{ steps.gh-app-auth.outputs.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Write job status to file
        if: always()
        id: write_job_status
        run: |
          if [[ ${{ contains(steps.*.outcome, 'failure') }} == "true" ]]; then
            echo "failure" > status.txt
          else
            echo "success" > status.txt
          fi
      
      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.env }}   # this is the artifact name
          path: status.txt
  
  postflight:
    runs-on: ubuntu-latest
    needs: destroy
    if: always()
    steps:
      - name: Download job status artifact
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: Set workflow outcome
        run: |
          files=$(find results -type f -name 'status.txt' 2>/dev/null)

          if [[ -z "$files" ]]; then
            echo "No job results found. Skipping failure check."
            exit 0
          fi

          if grep -xq 'failure' results/*/status.txt; then
            echo "At least one job failed. Failing workflow"
            exit 1
          else
            echo "All jobs passed"
          fi
          
