name: CI/CD

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Name of the environment to deploy manually.'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  # github.head_ref is only set when the workflow was triggered by a pull_request and it
  # contains the value of the source branch of the PR.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1

jobs:
  filter-envs:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.set-matrix.outputs.envs }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Detect changed envs
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/filters.yaml

      - id: set-matrix
        run: |
          echo "Check if we have a target environment set for manual deployment"
          if [[ "${TARGET_ENV}" != "" ]]; then
            echo "envs=[\"${TARGET_ENV}\"]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Using filtered environments"
          echo "envs=${CHANGES}" >> "${GITHUB_OUTPUT}"
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          CHANGES: ${{ steps.filter.outputs.changes }}
      
  deploy:
    needs: filter-envs
    if: |
      github.event.pull_request.draft == false &&
      needs.filter-envs.outputs.envs != '[]'
    strategy:
      matrix:
        env: ${{ fromJson(needs.filter-envs.outputs.envs) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    name: 'CI/CD: ${{ matrix.env }}'
    permissions:
      contents: read
      id-token: write

    concurrency:
      # github.head_ref is only set when the workflow was triggered by a pull_request and it
      # contains the value of the source branch of the PR.
      group: ${{ github.workflow }}-${{ matrix.env }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - run: echo "Deploying against ${{ matrix.env }} environment"
      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Get GH token from Github App
        id: gh-app-auth
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.NOTIFYCAL_CICD_APP_ID }}
          private_key: ${{ secrets.NOTIFYCAL_CICD_APP_SECRET }}

      - name: Hack for github internal repo access :(
        id: gh_internal_repo_access
        run: git config --global url."https://foo:${{ steps.gh-app-auth.outputs.token }}@github.com".insteadOf ssh://git@github.com

      - name: Configure AWS Credentials (OIDC Role)
        id: config_aws_credentials_oidc_role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_IAM_OIDC_ROLE_CI }}
          role-session-name: run-${{ github.run_id }}

      - run: aws sts get-caller-identity

      - name: Configure AWS Credentials (CI/CD Role)
        id: config_aws_credentials_ci_role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ fromJSON(env.IAM_ROLE_BY_ENV)[matrix.env] }}
          role-session-name: run-${{ github.run_id }}
          role-chaining: true
          role-duration-seconds: 3600  # chaining max is 3600s
        env:
          IAM_ROLE_BY_ENV: >-
            {
              "dev":"${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}",
              "dev-dan":"${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}",
              "dev-sj11":"${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}",
              "qa":"${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}",
              "demo":"${{ secrets.AWS_IAM_ROLE_CI_NONPROD }}",
              "prod":"${{ secrets.AWS_IAM_ROLE_CI_PROD }}"
            }

      - run: aws sts get-caller-identity

      - name: Get TF/TG version from version files
        id: get_tf_tg_version
        run: |
          echo "tofu_version=$(cat .opentofu-version)" >> "${GITHUB_OUTPUT}"
          echo "terragrunt_version=$(cat .terragrunt-version)" >> "${GITHUB_OUTPUT}"
      
      - name: Cached tofu and terragrunt binaries?
        id: tbinaries-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/tofu
            /usr/local/bin/terragrunt
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}-tg-${{ env.TG_VERSION }}
        env:
          TOFU_VERSION: ${{ steps.get_tf_tg_version.outputs.tofu_version }}
          TG_VERSION: ${{ steps.get_tf_tg_version.outputs.terragrunt_version }}

      - name: Install OpenTofu and Terragrunt
        id: tf_tg_install
        # Only if there is no cache
        if: steps.tbinaries-cache.outputs.cache-hit != 'true'
        run: |
          TEMP_DIR=$(mktemp -d)
          TOFU_DOWNLOAD_URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          TG_DOWNLOAD_URL="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"

          curl -sL "${TOFU_DOWNLOAD_URL}" -o "${TEMP_DIR}/tofu.tar.gz"
          curl -sL "${TG_DOWNLOAD_URL}" -o "${TEMP_DIR}/terragrunt" 
          
          tar -zxf "${TEMP_DIR}/tofu.tar.gz" -C "${TEMP_DIR}"

          chmod +x "${TEMP_DIR}/tofu" "${TEMP_DIR}/terragrunt"
          sudo mv "${TEMP_DIR}/tofu" "${TEMP_DIR}/terragrunt" /usr/local/bin

          rm -rf "${TEMP_DIR}"

          terragrunt --version
          tofu --version
        env:
          TOFU_VERSION: ${{ steps.get_tf_tg_version.outputs.tofu_version }}
          TG_VERSION: ${{ steps.get_tf_tg_version.outputs.terragrunt_version }}

      - name: Install service-discovery tool
        id: service_discovery_install_tool
        run: |
          pushd service-registration > /dev/null
          cp service-discovery.py /usr/local/bin/service-discovery
          cp mappings.json /usr/local/bin/
          popd > /dev/null
          service-discovery -h

      - name: Terragrunt init
        id: tg_init
        run: |
          cd envs/${{ matrix.env }}
          terragrunt run-all init
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          GH_TOKEN: ${{ steps.gh-app-auth.outputs.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terragrunt plan
        id: tg_plan
        run: |
          cd envs/${{ matrix.env }}
          terragrunt run-all plan
        env:
          GH_TOKEN: ${{ steps.gh-app-auth.outputs.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Terragrunt apply
        id: tg_apply
        run: |
          cd envs/${{ matrix.env }}
          terragrunt run-all apply
        # Apply only when:
        # - non prod merge to main branch (push event)
        # - prod manual trigger
        #
        # Lift prod guard when we get more confidence
        if: github.event_name != 'pull_request' && !(github.event_name == 'push' && matrix.env == 'prod')
        env:
          TERRAGRUNT_NON_INTERACTIVE: "true"
          GH_TOKEN: ${{ steps.gh-app-auth.outputs.token }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Write job status to file
        if: always()
        id: write_job_status
        run: |
          if [[ ${{ contains(steps.*.outcome, 'failure') }} == "true" ]]; then
            echo "failure" > status.txt
          else
            echo "success" > status.txt
          fi
      
      - name: Upload status artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: result-${{ matrix.env }}
          path: status.txt

  postflight:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Download job status artifact
        uses: actions/download-artifact@v6
        with:
          pattern: result-*
          path: results
      - name: Set workflow outcome
        run: |
          # Create an array from find results
          readarray -t status_files < <(find results -type f -name 'status.txt' 2>/dev/null)
          
          # Check if the array is empty
          if [[ ${#status_files[@]} -eq 0 ]]; then
            echo "No job results found. Skipping failure check."
            exit 0
          fi

          # Check if any file contains 'failure'
          if grep -xq 'failure' "${status_files[@]}"; then
            echo "At least one job failed. Failing workflow"
            exit 1
          else
            echo "All jobs passed"
          fi
