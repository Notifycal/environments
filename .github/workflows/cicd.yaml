name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      # Get module refs to retrieve build artifacts
      - run: terragrunt run-all init
      - run: terragrunt run-all plan
          
